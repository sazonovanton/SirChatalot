services:
  sirchatalot:
    build:
      context: .
      dockerfile: Dockerfile
    image: sazonovanton/sirchatalot:latest
    container_name: SirChatalot
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    # See docker-compose.yml for the optional autoheal setup that restarts the
    # container when the built-in HEALTHCHECK reports unhealthy.
