services:
  sirchatalot:
    image: sazonovanton/sirchatalot:latest
    container_name: SirChatalot
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    # The image ships a HEALTHCHECK (see Dockerfile). Docker only *reports*
    # unhealthy containers; uncomment the label and the autoheal service below
    # to have them restarted automatically.
    # labels:
    #   - autoheal=true

